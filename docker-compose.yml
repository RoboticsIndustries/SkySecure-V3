services:
  zookeeper:
    platform: linux/amd64
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    volumes:
      - zookeeperdata:/var/lib/zookeeper/data
      - zookeeperlog:/var/lib/zookeeper/log
    restart: unless-stopped
    networks: [skysecure]

  kafka:
    platform: linux/amd64
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 8
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafkadata:/var/lib/kafka/data
    networks: [skysecure]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      # The amd64 Kafka CLI can take ~40s under Apple Silicon emulation.
      interval: 15s
      timeout: 60s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  kafka-init:
    platform: linux/amd64
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./scripts/init-kafka.sh:/scripts/init-kafka.sh:ro
    entrypoint: ["/bin/bash", "/scripts/init-kafka.sh"]
    networks: [skysecure]

  redis:
    image: redis:7.2-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy volatile-lru
    volumes:
      - redisdata:/data
    restart: unless-stopped
    networks: [skysecure]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    platform: linux/amd64
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: skysecure
      POSTGRES_USER: skysecure
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks: [skysecure]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skysecure -d skysecure"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-migrate:
    platform: linux/amd64
    image: postgis/postgis:15-3.3
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./scripts/migrations/001_fusion_event_commits.sql:/migration-001.sql:ro
      - ./scripts/migrations/002_anomaly_history.sql:/migration-002.sql:ro
    entrypoint:
      - sh
      - -ec
      - |
        psql -v ON_ERROR_STOP=1 -h postgres -U skysecure -d skysecure -f /migration-001.sql
        psql -v ON_ERROR_STOP=1 -h postgres -U skysecure -d skysecure -f /migration-002.sql
    networks: [skysecure]

  adsb-ingestor:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: python -m ingestion.adsb_receiver
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_URL: redis://redis:6379/0
      ADSB_SOURCE: multi
      OPENSKY_USERNAME: ${OPENSKY_USERNAME:-}
      OPENSKY_PASSWORD: ${OPENSKY_PASSWORD:-}
      ADSB_FALLBACK_LAT: ${ADSB_FALLBACK_LAT:-39.9526}
      ADSB_FALLBACK_LON: ${ADSB_FALLBACK_LON:--75.1652}
      ADSB_FALLBACK_RADIUS_NM: ${ADSB_FALLBACK_RADIUS_NM:-250}
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [skysecure]

  mlat-solver:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: python -m processing.mlat_solver
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_URL: redis://redis:6379/0
      MLAT_RECEIVER_API_KEYS: '${MLAT_RECEIVER_API_KEYS:?Set MLAT_RECEIVER_API_KEYS in .env}'
      MLAT_SOLVER_SIGNING_KEY: '${MLAT_SOLVER_SIGNING_KEY:?Set MLAT_SOLVER_SIGNING_KEY in .env}'
      MLAT_RECEIVER_LOCATIONS: '{"receiver-london":[51.5074,-0.1278,15.0],"receiver-paris":[48.8566,2.3522,35.0],"receiver-brussels":[50.8503,4.3517,20.0],"receiver-amsterdam":[52.3676,4.9041,5.0]}'
      MLAT_MIN_RECEIVERS: 4
      MLAT_MIN_BASELINE_M: 1000
      MLAT_MIN_GEOMETRY_RATIO: 0.05
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [skysecure]

  fusion-engine:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: python -m processing.fusion_engine
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DSN: postgresql://skysecure:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/skysecure
      MLAT_SOLVER_SIGNING_KEY: '${MLAT_SOLVER_SIGNING_KEY:?Set MLAT_SOLVER_SIGNING_KEY in .env}'
      MLAT_RECEIVER_LOCATIONS: '{"receiver-london":[51.5074,-0.1278,15.0],"receiver-paris":[48.8566,2.3522,35.0],"receiver-brussels":[50.8503,4.3517,20.0],"receiver-amsterdam":[52.3676,4.9041,5.0]}'
      MLAT_MIN_RECEIVERS: 4
      MLAT_MIN_BASELINE_M: 1000
      MLAT_MIN_GEOMETRY_RATIO: 0.05
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      postgres-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [skysecure]

  anomaly-detector:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: python -m anomaly.detector
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_URL: redis://redis:6379/0
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [skysecure]

  api:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 1
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DSN: postgresql://skysecure:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/skysecure
      ADSB_FALLBACK_LAT: ${ADSB_FALLBACK_LAT:-39.9526}
      ADSB_FALLBACK_LON: ${ADSB_FALLBACK_LON:--75.1652}
      ADSB_FALLBACK_RADIUS_NM: ${ADSB_FALLBACK_RADIUS_NM:-250}
      OPERATOR_API_KEY: ${OPERATOR_API_KEY:-}
      MLAT_RECEIVER_API_KEYS: '${MLAT_RECEIVER_API_KEYS:?Set MLAT_RECEIVER_API_KEYS in .env}'
      MLAT_RECEIVER_LOCATIONS: '{"receiver-london":[51.5074,-0.1278,15.0],"receiver-paris":[48.8566,2.3522,35.0],"receiver-brussels":[50.8503,4.3517,20.0],"receiver-amsterdam":[52.3676,4.9041,5.0]}'
      MLAT_MIN_RECEIVERS: 4
      MLAT_MIN_BASELINE_M: 1000
      MLAT_MIN_GEOMETRY_RATIO: 0.05
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      postgres-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [skysecure]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_BIND_IP:-0.0.0.0}:3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [skysecure]

volumes:
  pgdata:
  redisdata:
  kafkadata:
  zookeeperdata:
  zookeeperlog:

networks:
  skysecure:
    driver: bridge
